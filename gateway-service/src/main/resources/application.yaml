server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        # Log Service
        - id: log-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/logs/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - RewritePath=/api/logs(?<segment>/?.*), /api/logs$\{segment}

        # Admin endpoints (also on logservice)
        - id: log-admin-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - RewritePath=/api/admin(?<segment>/?.*), /api/admin$\{segment}

        # Auth endpoints (on servicemanagementservice)
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - RewritePath=/api/auth(?<segment>/?.*), /api/auth$\{segment}

        # OAuth2 Login endpoints (on servicemanagementservice)
        - id: oauth2-service
          uri: http://localhost:8082
          predicates:
            - Path=/oauth2/**,/login/oauth2/code/**

        # Service Management
        - id: service-management-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/services/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - RewritePath=/api/services(?<segment>/?.*), /api/services$\{segment}

        # Notification Service
        - id: notification-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/notifications/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - RewritePath=/api/notifications(?<segment>/?.*), /api/notifications$\{segment}

        # WebSocket endpoint
        - id: websocket-service
          uri: http://localhost:8081
          predicates:
            - Path=/ws/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.kovanlabs: INFO

security:
  jwt:
    hmac-secret: ${JWT_SECRET:change-me-in-prod-change-me-in-prod}

gateway:
  rate-limit:
    requests-per-window: ${GATEWAY_RATE_LIMIT_REQUESTS:120}
    window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}